[pytest]
# The dev/CI entry point for the full suite:
#   .venv/bin/python -m pytest tests -q -n 8 --dist loadfile
# `loadfile` keeps a whole module in one worker: test_relabel shares one
# live-shaped fixture scrape per process, so splitting it pays that cost in
# every worker that gets a slice.
testpaths = tests
addopts = -q
