# megaspeed ingest configuration.
# Everything here is non-secret. Credentials come from the environment:
#   MEGASPEED_BB_TOKEN   (preferred, HTTP bearer)   or
#   MEGASPEED_BB_USER + MEGASPEED_BB_PASSWORD      (basic auth)
# and the base URL from MEGASPEED_BB_BASE_URL (or [bitbucket].base_url below).

[store]
# pseudonymised DuckDB store (gitignored). Fixture mode writes here; live runs
# should use their own store, e.g. the DEL corpus:
#   MEGASPEED_DB=data/del.duckdb
db = "data/megaspeed.duckdb"
# raw-zone identity resolution table: slug/email -> pseudonym. Never served,
# never committed, never queried by the analysis layer. Keep the live map
# persistent and git-ignored:
#   MEGASPEED_IDENTITY=data/identity.json
identity = "var/identity_map.json"

[filter]
# Only PRs matching at least one key are kept. Matched against source branch,
# PR title, PR description and commit messages. Raw text is read here and then
# discarded -- it never reaches the store.
ticket_regex = '\b[A-Z]+-\d+\b'
# Matches that do not look like a key are discarded rather than stored.
key_shape = '^[A-Z][A-Z0-9_]{0,9}-\d{1,6}$'
# Accepted project prefixes. A key counts only when its prefix is listed here,
# so technical tokens that look key-shaped (UTF-8, SHA-256, ISO-8601) never
# become tickets. The default below is the fixture/test project set:
#   [[source.repos]] in this file generates PROJ/OPS/ARCH keys.
ticket_projects = ["PROJ", "OPS", "ARCH"]
# Live corpora must override it with the real Jira project keys (env wins over
# this file). The DEL corpus is project DEL; FIX/golden has no keys by design:
#   MEGASPEED_TICKET_PROJECTS=DEL
# `ingest --verify` reads the same setting: it checks every stored ticket key
# against these prefixes, so point it at the project set that built the store.
#
# An explicit ticket-key set (prd/18) is the alternative to the prefix list: on
# a shared Jira project a prefix matches *everyone's* tickets, so scope the run
# to the team's keys instead. When a set is configured it replaces the prefix
# list entirely (the prefix list is ignored, and need not be set at all):
#   MEGASPEED_TICKET_KEYS=DEL-1234,DEL-5678
#   MEGASPEED_TICKET_KEYS_FILE=var/del-tickets.txt   (one key per line, # comments)
# Env and file are unioned; a malformed entry is a hard error. `--verify`
# rejects any stored TICKET key outside the set when one is configured.
ticket_keys = []
# ticket_keys_file = "var/del-tickets.txt"

[source]
[[source.repos]]
project = "ENG"
repo = "platform"
[[source.repos]]
project = "ENG"
repo = "mobile"

[bitbucket]
# Fixture mode is the default: leave base_url empty and this section is unused.
# Live mode reads MEGASPEED_BB_BASE_URL anyway; this is just a fallback.
base_url = ""          # e.g. https://bitbucket.example.com
page_limit = 25

# Local Bitbucket DC 9.4.18 labs:
#
#   :7990  bb-lab-a  FIX/golden      no Jira keys (transport/paging/reducer only)
#   :7991  bb-lab-b  DEL             licensed; delivery-api + delivery-web
#
# FIX/golden diagnostic (read-only; expect 0 kept PRs):
#   export MEGASPEED_BB_BASE_URL=http://127.0.0.1:7990
#   export MEGASPEED_BB_USER=admin
#   export MEGASPEED_BB_PASSWORD=admin-lab-pw
#   .venv/bin/python -m ingest --live --repo FIX/golden --probe
#
# Real DEL ingest (131 PRs -> 1316 events). The project override is required;
# without it every DEL PR is dropped by the filter:
#   export MEGASPEED_BB_BASE_URL=http://127.0.0.1:7991
#   export MEGASPEED_BB_USER=admin
#   export MEGASPEED_BB_PASSWORD=admin-lab-pw
#   export MEGASPEED_TICKET_PROJECTS=DEL
#   export MEGASPEED_DB=data/del.duckdb
#   export MEGASPEED_IDENTITY=data/identity.json
#   .venv/bin/python -m ingest --live --repo DEL/delivery-api --repo DEL/delivery-web
#   .venv/bin/python -m ingest --verify

[fixture]
seed = 20261115
# path = "fixtures/bitbucket-dc-fixture.json"   # load a committed bundle instead of generating

[jira]
# Jira Data Center source (prd/04): the ticket layer -- Epic / Story / Sprint
# objects plus status transitions and native worklogs -- that the Bitbucket PRs
# join to on the ticket key. Credentials come from the environment only:
#   MEGASPEED_JIRA_USER + MEGASPEED_JIRA_PASSWORD   (basic auth)
#   MEGASPEED_JIRA_TOKEN                            (personal access token, bearer)
# The base URL comes from MEGASPEED_JIRA_BASE_URL (env wins over this file).
#
# Local Jira DC 9.17.5 lab (jira-lab/): project DEL, epic DEL-1, stories
# DEL-100..199, 3 sprints, 199 native worklogs.
#   export MEGASPEED_JIRA_BASE_URL=http://127.0.0.1:8090
#   export MEGASPEED_JIRA_USER=admin MEGASPEED_JIRA_PASSWORD=admin-lab-pw
#   export MEGASPEED_JIRA_PROJECTS=DEL MEGASPEED_TICKET_PROJECTS=DEL
#   .venv/bin/python -m ingest scrape --jira --live --project DEL --probe
#   .venv/bin/python -m ingest scrape --jira --live --project DEL \
#       --out export/del-jira.tgz --state-dir export/del.state
base_url = ""          # e.g. http://127.0.0.1:8090
# Projects to read. Empty => the ticket projects (the ingest is ticket-scoped,
# so it reads exactly the projects it accepts keys from).
projects = []
page_limit = 50
# Politeness delay between requests, in seconds (0 for a local lab).
min_interval = 0.2
# Scrum board to read sprints from; 0 = discover the project's scrum board.
board = 0
# Custom-field ids. Empty => discover them by name, which is what you want:
# "Epic Link", "Sprint" and "Story Points" have different ids per installation
# (customfield_10100 / _10104 / _10106 on the lab). Pin them only if a field is
# ambiguous, e.g. two fields called "Story Points".
#   MEGASPEED_JIRA_EPIC_LINK_FIELD / _SPRINT_FIELD / _STORY_POINTS_FIELD
epic_link_field = ""
sprint_field = ""
story_points_field = ""

# Jira Cloud (prd/24): the same ticket layer over Cloud's v3 API + a Bearer PAT.
# Credentials come from the environment only:
#   MEGASPEED_JIRA_CLOUD_TOKEN   (a Cloud Personal Access Token)
# and the base URL from MEGASPEED_JIRA_CLOUD_BASE_URL (env wins over this file).
# In development that is the local emulation proxy in front of the DC lab:
#   python3 -m proxy.cloud_jira_proxy --upstream http://127.0.0.1:8090 \
#       --port 8091 --pat cloud-lab-pat --user admin --password admin-lab-pw
#   export MEGASPEED_JIRA_CLOUD_BASE_URL=http://127.0.0.1:8091
#   export MEGASPEED_JIRA_CLOUD_TOKEN=cloud-lab-pat
#   .venv/bin/python -m ingest scrape --jira-cloud --live --project DEL --probe
# Production: cloud_base_url = "https://acme.atlassian.net" + a real PAT.
cloud_base_url = ""    # e.g. https://acme.atlassian.net (or the local proxy)

[classify]
# Scrape-side text classification (prd/16): comment bodies + PR descriptions are
# read locally, projected onto the closed vocabulary (comment_type,
# thread_outcome, question phase) and then discarded. Only the labels cross.
enabled = true
# backend: "ollama" (live runs) or "mock" (deterministic, no model). Fixture
# runs always use the mock. Environment wins:
#   MEGASPEED_TEXT_CLASSIFY=0   MEGASPEED_TEXT_BACKEND=mock
backend = "ollama"
# The local Ollama box on the precision network (k3s home-iot/ollama-moe).
# CPU-only, Qwen3 30B MoE (~3B active, Q4_K_M). No API key: local net only.
llm_url = "http://10.43.36.10:11434"
llm_model = "qwen3-30b-a3b:2507"
llm_timeout = 180

[review]
# Known sentinel-team slugs. Membership is deterministic (known account set),
# so `sentinel=true/false` is a label, not an inference.
sentinel_slugs = ["toomas.bruno", "kristjan.saar"]

[actors]
# Known bot / service accounts (prd/02 "Bot vs human"). DC's user type SERVICE
# is always classified as a bot regardless of this list; these slugs catch
# CI/build accounts that DC reports as NORMAL users. Slugs not listed here but
# shaped like a service account (…-bot, ci-, build-, system-user) are bots too.
#   MEGASPEED_BOT_SLUGS=jenkins,bamboo   (env wins over this file)
bot_slugs = ["bitbucket.system-user", "stash.system-user", "jenkins", "bamboo",
             "github-actions", "gitlab-runner"]
