name: build-scraper

# The scraper is the airgapped component (prd/11, prd/13): source -> classify ->
# pseudonymise -> tgz. It is built as a self-contained artifact so it can be
# carried onto an isolated box, so this job only runs when that component (or
# the way we build it) actually changed. An app/server change must not rebuild
# it -- that is what the `paths:` filters below are for.

on:
  push:
    branches: [main]
    paths:
      - "ingest/**"
      - "scrape/**"
      - ".github/workflows/build-scraper.yml"
      # build / dependency manifests for the artifact
      - "scrape/requirements-build.txt"
      - "requirements*.txt"
      - "pyproject.toml"
      - "setup.py"
      - "setup.cfg"
      - "Makefile"
  pull_request:
    branches: [main]
    paths:
      - "ingest/**"
      - "scrape/**"
      - ".github/workflows/build-scraper.yml"
      - "scrape/requirements-build.txt"
      - "requirements*.txt"
      - "pyproject.toml"
      - "setup.py"
      - "setup.cfg"
      - "Makefile"

# Least privilege by default (SEC-5). The build/test job only reads the repo;
# the release job below is the only place that needs `contents: write`.
permissions:
  contents: read

concurrency:
  group: build-scraper-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: megaspeed-scrape (onefile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scrape/requirements-build.txt

      - name: Scrape-side contract tests (stdlib only, no DuckDB)
        run: python -m unittest discover -s scrape/tests -v

      - name: Build megaspeed-scrape
        # The same script developers run locally; fails loudly if PyInstaller is
        # missing instead of silently shipping the weaker zipapp fallback.
        run: bash scrape/build.sh --pyinstaller

      - name: Smoke test the artifact
        # No repo, no venv, no installed dependencies: fixture source -> tgz.
        run: |
          ./scrape/dist/megaspeed-scrape --version
          tmp="$(mktemp -d)"
          MEGASPEED_REPOS=ENG/platform,ENG/mobile \
            ./scrape/dist/megaspeed-scrape --fixture --n 3 --out "$tmp/smoke.tgz" --json > "$tmp/report.json"
          python - "$tmp/report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          assert report["events"] > 0, report
          assert report["bundle"].endswith(".tgz")
          print(f"smoke: {report['events']} events, {report['counts']['objects']} objects")
          PY

      - name: Upload scraper artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: megaspeed-scrape-${{ github.sha }}
          path: scrape/dist/megaspeed-scrape
          if-no-files-found: error
          retention-days: 30

  release:
    name: publish scraper release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that can write; the build/test job above cannot (SEC-5).
    permissions:
      contents: write
    steps:
      - name: Download the built artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: megaspeed-scrape-${{ github.sha }}
          path: scrape/dist

      - name: Create release + tag (main push)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: scraper-${{ github.sha }}
          name: megaspeed-scrape ${{ github.sha }}
          generate_release_notes: true
          files: scrape/dist/megaspeed-scrape
          fail_on_unmatched_files: true
